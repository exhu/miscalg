<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal FreePascal HTTP Server</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="container">
    <h1>Minimal FreePascal HTTP Server</h1>
    <p>Minimal HTTP server written in FreePascal (ObjFPC mode) with simple routing and static file serving.</p>
    <form action="/hello" method="get" class="greeting-form">
      <label for="name">Type your name:</label>
      <input type="text" id="name" name="name" placeholder="Enter your name" required>
      <button type="submit">Submit</button>
    </form>
  </main>
</body>
</html>
